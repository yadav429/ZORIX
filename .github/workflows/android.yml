name: ZORIX Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Google Sign-In plugin
        uses: actions/checkout@v4
        with:
          repository: NiqueWrld/GodotGoogleSignIn
          ref: main
          path: .godot-google-sign-in
          persist-credentials: false

      - name: Install Google Sign-In plugin
        run: |
          mkdir -p addons
          cp -R .godot-google-sign-in/addons/GodotGoogleSignIn addons/GodotGoogleSignIn
          test -s addons/GodotGoogleSignIn/plugin.cfg
          test -s addons/GodotGoogleSignIn/bin/release/GodotGoogleSignIn-release.aar

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.1" "ndk;28.1.13356709" "cmake;3.10.2.4988404"

      - name: Cache Godot 4.7 engine and export templates
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/godot-ci
            ~/.local/share/godot/export_templates/4.7.stable
          key: godot-4.7-linux-android-${{ runner.os }}-v1

      - name: Setup Godot 4.7 with cached download fallback
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          GODOT_VERSION="4.7-stable"
          GODOT_DIR="$HOME/.local/share/godot-ci"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.7.stable"
          mkdir -p "$GODOT_DIR" "$TEMPLATE_DIR"

          download_asset() {
            local filename="$1"
            local output="$2"
            local tmp="${output}.part"
            local urls=(
              "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${filename}"
              "https://sourceforge.net/projects/godot-engine.mirror/files/${GODOT_VERSION}/${filename}/download"
            )

            for url in "${urls[@]}"; do
              echo "Trying download source: ${url}"
              rm -f "$tmp"
              if curl --fail --location --show-error \
                --connect-timeout 30 --max-time 900 \
                --speed-time 120 --speed-limit 10240 \
                --retry 3 --retry-all-errors --retry-delay 5 \
                "$url" --output "$tmp" && unzip -tq "$tmp" >/dev/null; then
                mv "$tmp" "$output"
                echo "Downloaded and ZIP-validated: ${filename}"
                return 0
              fi
              echo "Download source failed or archive validation failed: ${url}"
            done

            echo "::error::Could not download a valid ${filename} from either configured source."
            return 1
          }

          if [ ! -x "$GODOT_DIR/godot" ]; then
            download_asset "Godot_v${GODOT_VERSION}_linux.x86_64.zip" "$GODOT_DIR/godot.zip"
            unzip -q "$GODOT_DIR/godot.zip" -d "$GODOT_DIR"
            mv "$GODOT_DIR/Godot_v${GODOT_VERSION}_linux.x86_64" "$GODOT_DIR/godot"
            chmod +x "$GODOT_DIR/godot"
          else
            echo "Using cached Godot executable."
          fi

          if [ -z "$(find "$TEMPLATE_DIR" -maxdepth 1 -type f -print -quit)" ]; then
            download_asset "Godot_v${GODOT_VERSION}_export_templates.tpz" "$GODOT_DIR/export_templates.tpz"
            mkdir -p "$GODOT_DIR/templates"
            unzip -q "$GODOT_DIR/export_templates.tpz" -d "$GODOT_DIR/templates"
            test -d "$GODOT_DIR/templates/templates"
            cp -a "$GODOT_DIR/templates/templates/." "$TEMPLATE_DIR/"
          else
            echo "Using cached Godot export templates."
          fi

          echo "$GODOT_DIR" >> "$GITHUB_PATH"
          export PATH="$GODOT_DIR:$PATH"
          godot --version
          test -x "$GODOT_DIR/godot"
          test -n "$(find "$TEMPLATE_DIR" -maxdepth 1 -type f -print -quit)"

      - name: Configure Godot Android paths
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<SETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          SETTINGS

      - name: Start ADB server for headless Android tooling
        run: |
          set -euo pipefail
          adb start-server
          adb devices

      - name: Install Android Gradle build template
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.7.stable"
          ANDROID_SOURCE="$(find "$TEMPLATE_DIR" -maxdepth 2 -type f -name android_source.zip -print -quit)"
          if [ -z "$ANDROID_SOURCE" ]; then
            echo "::error::android_source.zip is missing from the Godot 4.7 export templates."
            find "$TEMPLATE_DIR" -maxdepth 2 -type f -print | sort
            exit 1
          fi

          # Reproduce Godot 4.7's Android template installer metadata.
          # Godot checks android/.build_version before running Gradle export.
          mkdir -p android/build
          unzip -q "$ANDROID_SOURCE" -d android/build
          printf '%s\n' '4.7.stable' > android/.build_version
          : > android/build/.gdignore
          test -s android/.build_version
          test -s android/build/build.gradle
          test -s android/build/settings.gradle
          echo "Installed Android Gradle template from: $ANDROID_SOURCE"
          echo "Template identifier: $(cat android/.build_version)"
          find android/build -maxdepth 2 -type f | sort | head -100

      - name: Import project and load Android plugin
        run: godot --headless --editor --path . --quit

      - name: Export APK (release when signing secrets are configured)
        env:
          ZORIX_KEYSTORE_BASE64: ${{ secrets.ZORIX_KEYSTORE_BASE64 }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/zorix-release.jks
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ZORIX_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ZORIX_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p build
          if [ -n "$ZORIX_KEYSTORE_BASE64" ] && [ -n "$GODOT_ANDROID_KEYSTORE_RELEASE_USER" ] && [ -n "$GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD" ]; then
            printf '%s' "$ZORIX_KEYSTORE_BASE64" | base64 --decode > "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH"
            godot --headless --path . --export-release "Android" build/ZORIX.apk
            actual_sha1=$("$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --print-certs build/ZORIX.apk | awk -F': ' '/Signer #1 certificate SHA-1 digest/ {print tolower($2)}' | tr -d ':')
            expected_sha1="060dc9746a822c2c54a60037c7c021a858f353cf"
            test "$actual_sha1" = "$expected_sha1"
            echo "Release APK signing SHA-1 matches the Google Android OAuth client."
          else
            echo "::warning::Release signing secrets are not configured. Building a debug APK; Google Android OAuth will not match the registered release SHA-1 yet."
            godot --headless --path . --export-debug "Android" build/ZORIX.apk
          fi

      - name: Test player API
        run: |
          set -euo pipefail
          curl --fail --silent --show-error https://zorix-player-api-dnz5.onrender.com/api/health
          status=$(curl --silent --output /tmp/google-auth-response.json --write-out '%{http_code}' -H 'Content-Type: application/json' -X POST -d '{"id_token":"invalid-test-token-not-a-real-credential"}' https://zorix-player-api-dnz5.onrender.com/api/google)
          test "$status" = "401"
          echo "Google token verification endpoint rejects invalid tokens as expected."

      - name: Verify APK
        run: |
          test -s build/ZORIX.apk
          ls -lh build/ZORIX.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZORIX-Android-APK
          path: build/ZORIX.apk
          if-no-files-found: error
