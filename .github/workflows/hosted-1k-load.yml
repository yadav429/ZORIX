name: ZORIX controlled 1K hosted API load test

on:
  pull_request:
    branches: [main]
    paths:
      - "loadtest/locustfile_hosted_1k.py"
      - ".github/workflows/hosted-1k-load.yml"

permissions:
  contents: read

jobs:
  hosted-api-1k:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Locust
        run: python -m pip install --upgrade pip locust

      - name: Confirm hosted API health before load
        run: |
          curl --fail --silent --show-error --max-time 20 https://zorix-player-api-dnz5.onrender.com/api/health

      - name: Run exactly 1,000 read-only virtual sessions
        run: |
          python -m locust -f loadtest/locustfile_hosted_1k.py \
            --host https://zorix-player-api-dnz5.onrender.com \
            --users 1000 \
            --spawn-rate 20 \
            --run-time 180s \
            --stop-timeout 10 \
            --headless \
            --exit-code-on-error 1 \
            --html hosted-1k-load-report.html \
            --csv hosted-1k-load

      - name: Upload 1K load-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zorix-hosted-1k-load-report
          path: |
            hosted-1k-load-report.html
            hosted-1k-load_*.csv
          if-no-files-found: ignore
