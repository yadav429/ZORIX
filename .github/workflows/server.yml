name: ZORIX Dedicated Server

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.7 with download fallback
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION="4.7-stable"
          GODOT_DIR="$HOME/.local/share/godot-ci"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.7.stable"
          mkdir -p "$GODOT_DIR" "$TEMPLATE_DIR"

          download_asset() {
            local filename="$1"
            local output="$2"
            local tmp="${output}.part"
            local urls=(
              "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${filename}"
              "https://sourceforge.net/projects/godot-engine.mirror/files/${GODOT_VERSION}/${filename}/download"
            )

            for url in "${urls[@]}"; do
              echo "Trying download source: ${url}"
              rm -f "$tmp"
              if curl --fail --location --show-error \
                --connect-timeout 30 --max-time 1800 \
                --retry 3 --retry-all-errors --retry-delay 5 \
                "$url" --output "$tmp" && unzip -tq "$tmp" >/dev/null; then
                mv "$tmp" "$output"
                echo "Downloaded and ZIP-validated: ${filename}"
                return 0
              fi
              echo "Download source failed or archive validation failed: ${url}"
            done

            echo "::error::Could not download a valid ${filename} from either configured source."
            return 1
          }

          ENGINE_ARCHIVE="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          TEMPLATE_ARCHIVE="Godot_v${GODOT_VERSION}_export_templates.tpz"

          download_asset "$ENGINE_ARCHIVE" "$GODOT_DIR/godot.zip"
          unzip -q "$GODOT_DIR/godot.zip" -d "$GODOT_DIR"
          test -f "$GODOT_DIR/Godot_v${GODOT_VERSION}_linux.x86_64"
          mv "$GODOT_DIR/Godot_v${GODOT_VERSION}_linux.x86_64" "$GODOT_DIR/godot"
          chmod +x "$GODOT_DIR/godot"
          echo "$GODOT_DIR" >> "$GITHUB_PATH"
          export PATH="$GODOT_DIR:$PATH"

          download_asset "$TEMPLATE_ARCHIVE" "$GODOT_DIR/export_templates.tpz"
          mkdir -p "$GODOT_DIR/templates"
          unzip -q "$GODOT_DIR/export_templates.tpz" -d "$GODOT_DIR/templates"
          test -d "$GODOT_DIR/templates/templates"
          cp -a "$GODOT_DIR/templates/templates/." "$TEMPLATE_DIR/"

          godot --version
          test -x "$GODOT_DIR/godot"
          test -n "$(find "$TEMPLATE_DIR" -maxdepth 1 -type f -print -quit)"

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Export Linux x86_64 dedicated server
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Linux Server" build/zorix-server.x86_64
          test -s build/zorix-server.x86_64
          chmod +x build/zorix-server.x86_64
          file build/zorix-server.x86_64

      - name: Export Linux ARM64 dedicated server
        run: |
          godot --headless --path . --export-release "Linux ARM64 Server" build/zorix-server.arm64
          test -s build/zorix-server.arm64
          chmod +x build/zorix-server.arm64
          file build/zorix-server.arm64

      - name: Upload x86_64 server artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZORIX-Linux-x86_64-Server
          path: build/zorix-server.x86_64
          if-no-files-found: error

      - name: Upload ARM64 server artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZORIX-Linux-ARM64-Server
          path: build/zorix-server.arm64
          if-no-files-found: error
