name: ZORIX Dedicated Server

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.7
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.7-stable
          export-templates: true

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Export Linux x86_64 dedicated server
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Linux Server" build/zorix-server.x86_64
          chmod +x build/zorix-server.x86_64
          file build/zorix-server.x86_64

      - name: Export Linux ARM64 dedicated server
        run: |
          godot --headless --path . --export-release "Linux ARM64 Server" build/zorix-server.arm64
          chmod +x build/zorix-server.arm64
          file build/zorix-server.arm64

      - name: Upload x86_64 server artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZORIX-Linux-x86_64-Server
          path: build/zorix-server.x86_64
          if-no-files-found: error

      - name: Upload ARM64 server artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZORIX-Linux-ARM64-Server
          path: build/zorix-server.arm64
          if-no-files-found: error
